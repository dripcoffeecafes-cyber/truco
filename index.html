<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Os Gafanhotos — carteado da turma</title>
  <meta name="description" content="Placar divertido pra marcar Truco, Pontinho, Três Sete e Canastra com os amigos. Funciona offline.">
  <meta name="theme-color" content="#0f3d2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gafanhotos">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <main id="screen" class="screen"></main>
    <nav id="tabbar" class="tabbar">
      <button class="tab" data-tab="home" aria-label="Jogar">
        <svg viewBox="0 0 24 24"><use href="#i-cards"/></svg><span>Jogar</span>
      </button>
      <button class="tab" data-tab="hall" aria-label="Hall da fama">
        <svg viewBox="0 0 24 24"><use href="#i-trophy"/></svg><span>Hall</span>
      </button>
      <button class="tab" data-tab="rules" aria-label="Regras">
        <svg viewBox="0 0 24 24"><use href="#i-book"/></svg><span>Regras</span>
      </button>
    </nav>
  </div>

  <canvas id="fx" class="fx"></canvas>
  <div id="overlay" class="overlay hidden"></div>
  <div id="toast" class="toast"></div>

  <!-- Biblioteca de ícones (desenhos próprios, genéricos) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-cards" viewBox="0 0 24 24">
        <path fill="currentColor" d="M7.5 4.2 15.3 2l3.9 14.4-7.8 2.1z" opacity=".55"/>
        <rect x="3" y="6" width="9.5" height="14" rx="1.6" fill="currentColor"/>
        <path d="M7.7 10.2c-1.4-1.8-3.6-.3-2.7 1.5.6 1.2 2.7 2.8 2.7 2.8s2.1-1.6 2.7-2.8c.9-1.8-1.3-3.3-2.7-1.5z" fill="#0f3d2e"/>
      </symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24">
        <path fill="currentColor" d="M7 3h10v2h3v3c0 2.4-1.8 4.3-4.1 4.8A5 5 0 0 1 13 15.9V18h3v2H8v-2h3v-2.1a5 5 0 0 1-2.9-3.1C5.8 12.3 4 10.4 4 8V5h3V3zm-1 4v1c0 1.2.7 2.2 1.8 2.7A8 8 0 0 1 7 7H6zm12 0h-1a8 8 0 0 1-.8 3.7C17.3 10.2 18 9.2 18 8V7z"/>
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path fill="currentColor" d="M5 3h12a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.5.5H7a1 1 0 0 0 0 2h12v2H7a3 3 0 0 1-3-3V5a2 2 0 0 1 1-2zm2 2v12h10V5H7zm2 2h6v2H9V7zm0 3h6v2H9v-2z"/>
      </symbol>
      <symbol id="i-undo" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 5a7 7 0 0 1 7 7 7 7 0 0 1-7 7H9v-2h3a5 5 0 1 0 0-10H7.8l2.6 2.6L9 11 4 6l5-5 1.4 1.4L7.8 5H12z"/>
      </symbol>
      <symbol id="i-back" viewBox="0 0 24 24">
        <path fill="currentColor" d="m14.7 5.3 1.4 1.4L10.8 12l5.3 5.3-1.4 1.4L8 12z"/>
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24">
        <path fill="currentColor" d="M19.4 13a7.8 7.8 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3H9l-.3 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.8 7.8 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L9 21h6l.3-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/>
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4L12 13.4 6.4 19 5 17.6l5.6-5.6L5 6.4z"/></symbol>
      <symbol id="i-skull" viewBox="0 0 24 24">
        <path fill="currentColor" d="M12 2a8 8 0 0 0-8 8c0 2.6 1.3 4.9 3.2 6.3V19a2 2 0 0 0 2 2h5.6a2 2 0 0 0 2-2v-2.7A8 8 0 0 0 12 2zM9 12.5A2 2 0 1 1 9 8.5a2 2 0 0 1 0 4zm6 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm-4 4-1-2.5h4l-1 2.5h-2z"/>
      </symbol>
      <symbol id="i-flame" viewBox="0 0 24 24">
        <path fill="currentColor" d="M13.5 2s.8 3.3-1.1 5.6C10.7 9.6 9 10.6 9 13a3 3 0 0 0 .3 1.3C8.5 13.7 8 12.5 8 11c-3 2-4 5-4 7a8 8 0 0 0 16 0c0-5-3.6-7.6-6.5-16zm-1.5 19a3 3 0 0 1-3-3c0-1.6 1.2-2.6 2.3-3.9.6 1.6 2.4 2 2.4 3.9A3 3 0 0 1 12 21z"/>
      </symbol>
    </defs>
  </svg>

  <script src="js/rules.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
